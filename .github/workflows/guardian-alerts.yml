name: Guardian alerts

# Every 5 minutes: read new Telegram bot messages (subscriptions), scan Base Sepolia for events from
# watched vaults, and message everyone watching them. One bot serves any number of people and vaults.
# - Subscribers: encrypted (key derived from the bot token) on the `alerts-state` branch. Durable, private.
# - Last scanned block: a working file in the Actions cache.
# Setup: add the TELEGRAM_BOT_TOKEN secret, and optionally the MORA_APP_URL variable (see alerts/README.md).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: guardian-alerts
  cancel-in-progress: false

permissions:
  contents: write # only to commit the encrypted subscriber list to the alerts-state branch

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALERTS_STATE_KEY: ${{ secrets.ALERTS_STATE_KEY }}
      MORA_APP_URL: ${{ vars.MORA_APP_URL }}
      STATE_FILE: alerts/state.json
      DURABLE_FILE: alerts-state/subscribers.enc.json
      REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: Skip until the bot token is configured
        if: env.TELEGRAM_BOT_TOKEN == ''
        run: echo "::notice::TELEGRAM_BOT_TOKEN secret is not set; guardian alerts are off."

      - uses: actions/checkout@v4
        if: env.TELEGRAM_BOT_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.TELEGRAM_BOT_TOKEN != ''
        with:
          node-version: 22

      - name: Restore working state
        if: env.TELEGRAM_BOT_TOKEN != ''
        uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: mora-alerts-${{ github.run_id }}
          restore-keys: mora-alerts-

      - name: Load subscribers
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: bash alerts/state-branch.sh load alerts-state

      - name: Install
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: npm install --prefix alerts --no-package-lock --no-audit --no-fund

      - name: Check vaults and send alerts
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: node alerts/watch.js

      - name: Save subscribers
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        run: bash alerts/state-branch.sh save alerts-state

      - name: Save working state
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && hashFiles('alerts/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alerts/state.json
          key: mora-alerts-${{ github.run_id }}-${{ github.run_attempt }}
